<link href="{{ site.baseurl }}assets/css/gallery.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/css/lightgallery-bundle.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/lightgallery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/plugins/zoom/lg-zoom.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/plugins/thumbnail/lg-thumbnail.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const coverLinks = document.querySelectorAll(".gallery-item");

  // Build a master list of all images from all albums
  const allImages = [];

  coverLinks.forEach(link => {
    const albumName = link.dataset.album;
    const albumGroup = document.querySelector(`#album-${albumName}`);

    // Add the cover image first
    allImages.push({
      src: link.getAttribute("data-src"),
      thumb: link.querySelector("img").getAttribute("src"),
      subHtml: link.getAttribute("data-sub-html"),
      album: albumName // This 'album' property is key
    });

    // Add all hidden images in the album
    if (albumGroup) {
      Array.from(albumGroup.querySelectorAll("a")).forEach(a => {
        allImages.push({
          src: a.getAttribute("data-src"),
          thumb: a.getAttribute("data-thumb") || a.getAttribute("data-src"),
          subHtml: a.getAttribute("data-sub-html"),
          album: albumName // This 'album' property is key
        });
      });
    }
  });

  // Attach event listener to each cover link
  coverLinks.forEach((link, index) => {
    link.addEventListener("click", function(e) {
      e.preventDefault();

      // Find the index of the clicked cover in the full image list
      const startIndex = allImages.findIndex(
        img => img.src === this.getAttribute("data-src")
      );

      const dynamicGallery = lightGallery(this, {
        dynamic: true,
        dynamicEl: allImages,
        index: startIndex >= 0 ? startIndex : 0,
        plugins: [lgZoom, lgThumbnail],
        speed: 500,
        thumbnail: true,
        zoomFromOrigin: false,
        download: false,
        counter: true,
        loop: true
      });

      // Listen for the 'lgAfterSlide' event, which fires on load and every slide change
      this.addEventListener('lgAfterSlide', (event) => {

        // 1. Get the album name of the currently visible image
        const currentSlideIndex = event.detail.index;
        const currentAlbum = allImages[currentSlideIndex].album;

        // 2. Find the active lightGallery container in the document
        // This is more reliable than using the instance variable.
        const lgContainer = document.querySelector('.lg-container.lg-show');

        if (!lgContainer) {
          console.warn('lightGallery container not found.');
          return;
        }

        // 3. Find all thumbnail items *within* that active container
        const allThumbs = lgContainer.querySelectorAll('.lg-thumb-item');

        // 4. Loop over all thumbnails and compare their album
        allThumbs.forEach((thumb, i) => {
          // 'i' corresponds to the index in our allImages array
          const thumbAlbum = allImages[i] ? allImages[i].album : null;

          if (thumbAlbum === currentAlbum) {
            // This thumb is in the current album, make it full color
            thumb.classList.remove('grayscale-thumb');
          } else {
            // This thumb is from a different album, make it grayscale
            thumb.classList.add('grayscale-thumb');
          }
        });
      });
      dynamicGallery.openGallery();
    });
  });
});
</script>
