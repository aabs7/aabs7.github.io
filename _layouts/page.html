---
layout: default
---
<article class="post">

{% if page.hide_title != true %}
  <header class="post-header">
    {% if page.title != nil %}
      <h1 class="post-title">{{ page.title | escape }}</h1>
    {% else %}
      <h1 class="post-title">{{ site.title | escape }}</h1>
    {% endif %}
  </header>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

</article>
