layout: page

<!-- Add font-awesome for icons for profile -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<div class="home">
    <div class="home-intro-container">
        <div class="home-intro-text">
            {{ content }}
        </div>
        <div class="home-intro-image">
            <img src="{{ '/assets/images/Abhish_Khanal_profile_pic.jpg' | relative_url }}" alt="A photo of me">
            <div class="social-links">
                <a href="https://github.com/aabs7" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
                <a href="mailto:abheeshkhanal@gmail.com" title="Email"><i class="fas fa-envelope"></i></a>
                <a href="https://scholar.google.com/citations?user=dLdbu8YAAAAJ" target="_blank" title="Google Scholar"><i class="fab fa-google-scholar"></i></a>
                <a href="https://linkedin.com/in/aabs7" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="https://youtube.com/@abhishkhanal" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
            </div>
            <div class="resume-container">
                <a href="{{'/assets/files/Abhish_resume.pdf' | relative_url }}" download>Download Resume</a>
            </div>
    </div>
    </div>


    <h3> Recent Posts <a href="{{ '/blogs/' | relative_url }}" class="home-recent-blogs-more">...</a> </h3>
    {%- if site.posts.size > 0 -%}
        {%- for post in site.posts limit:6-%}
            <h6 class="home-recent-blogs">
                <a href="{{post.url | relative_url}}">
                    {{post.title | escape}}
                </a>
                <span class="post-date">{{ post.date | date: "%b %d, %Y" }}</span>
            </h6>
        {%- endfor -%}
    {%- endif -%}
</div>
